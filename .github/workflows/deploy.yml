name: Deploy Backend to Amazon ECR & EKS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_API_REPOSITORY: wms-backend-api-repo
  ECR_WORKER_REPOSITORY: wms-backend-worker-repo

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint (Ruff)
        run: uv run ruff check app/

      - name: Run Tests
        run: uv run pytest -q

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push API image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_API_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_API_REPOSITORY:latest

      - name: Build, tag, and push Worker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # The worker uses the same codebase, so we tag it similarly
          docker tag $ECR_REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG

      - name: Update KubeConfig
        run: aws eks update-kubeconfig --name wms-ai-cluster --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 아직 클러스터에 Deployment 매니페스트가 없어 실제 롤아웃은 하지 않는다.
          # k8s/ 에 Deployment/Service/Secret 를 추가한 뒤 아래 두 줄을 활성화할 것.
          # kubectl set image deployment/wms-api api=$ECR_REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG
          # kubectl set image deployment/wms-ai-worker ai-worker=$ECR_REGISTRY/$ECR_WORKER_REPOSITORY:$IMAGE_TAG
          echo "::warning::ECR 푸시까지만 수행했습니다. EKS 롤아웃은 매니페스트 준비 후 활성화됩니다."
