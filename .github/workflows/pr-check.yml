name: Backend PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync --frozen --dev

      # 하드 게이트. 규칙셋과 ignore 사유는 pyproject [tool.ruff.lint]에 문서화되어 있다.
      - name: Lint (Ruff)
        run: uv run ruff check app/

      # 하드 게이트. app/ai 포맷 부채는 조장 승인(2026-09-01) 후 정리 완료되어
      # 이제 전 범위를 검사한다.
      - name: Format Check (Ruff)
        run: uv run ruff format --check app/

      # 하드 게이트. 테스트가 깨진 채로 머지되던 `|| echo` 무력화를 제거했다.
      - name: Test (Pytest)
        run: uv run pytest -q

      # 하드 게이트. 오류가 남은 44개 모듈은 pyproject [[tool.mypy.overrides]]에
      # 사유와 함께 베이스라인으로 제외했고, 나머지 108개 모듈은 여기서 지켜진다.
      - name: Type Check (Mypy)
        run: uv run mypy app/
