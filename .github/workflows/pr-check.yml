name: Backend PR Check

on:
  pull_request:
    branches:
      - main
  # 브랜치에서 게이트를 직접 돌려보기 위한 수동 실행
  workflow_dispatch:

jobs:
  quality-gate:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync --frozen --dev

      # 하드 게이트. 규칙셋과 ignore 사유는 pyproject [tool.ruff.lint] 참조.
      - name: Lint (Ruff)
        run: uv run ruff check app/

      # 하드 게이트
      - name: Format Check (Ruff)
        run: uv run ruff format --check app/

      # 하드 게이트
      - name: Test (Pytest)
        run: uv run pytest -q

      # 하드 게이트. 베이스라인 제외 모듈은 pyproject [[tool.mypy.overrides]] 참조.
      - name: Type Check (Mypy)
        run: uv run mypy app/
