name: Backend PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync --frozen --dev

      # 하드 게이트. 규칙셋과 ignore 사유는 pyproject [tool.ruff.lint]에 문서화되어 있다.
      - name: Lint (Ruff)
        run: uv run ruff check app/

      # 프리즈 구역(app/ai)은 포맷 부채 정리에 조장 승인이 필요해 제외한다.
      # 승인 후 `uv run ruff format app/ai` 를 적용하고 이 --exclude 를 제거할 것.
      - name: Format Check (Ruff)
        run: uv run ruff format --check app/ --exclude "app/ai"

      # 하드 게이트. 테스트가 깨진 채로 머지되던 `|| echo` 무력화를 제거했다.
      - name: Test (Pytest)
        run: uv run pytest -q

      # 타입 부채가 남아 있어 아직 비차단이다. 정리 후 `|| true` 를 제거할 것.
      - name: Type Check (Mypy, non-blocking)
        run: uv run mypy app/ --ignore-missing-imports || true
