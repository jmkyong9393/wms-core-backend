[project]
name = "wms-core-backend"
version = "0.1.0"
description = "B2B AI Book Inspection & WMS Platform"
readme = "guide.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlmodel>=0.0.19",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.3.4",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "langchain>=0.2.6",
    "langgraph>=0.1.4",
    "langchain-openai>=0.1.10",
    "langgraph-checkpoint>=1.0.0",
    "langchain-chroma>=0.1.0",
    "pillow>=10.3.0",
    "ultralytics>=8.4.105",
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "celery>=5.6.3",
    "redis>=8.0.1",
    "gevent>=26.5.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-community>=0.4.2",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "clip-anytorch>=2.6.0",
    "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.2.2",
    "ruff>=0.16.5",
]

[tool.ruff]
# 한글 주석·문자열이 88자를 자주 넘어 120으로 둔다.
line-length = 120

[tool.ruff.lint]
# 도구 업그레이드로 CI가 갑자기 깨지지 않도록 룰셋을 명시 고정한다.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]

# 아래 ignore는 검토 후 내린 결정이다. 되살릴 때는 근거를 남길 것.
ignore = [
    # 런타임 어노테이션: FastAPI·Pydantic·SQLModel이 타입 힌트를 런타임에 평가하므로
    # 일괄 현대화는 필드 추론을 바꿀 수 있다.
    "UP006", "UP045", "UP035", "RUF013",
    # Depends()/Query()를 기본 인자로 쓰는 것은 FastAPI 표준이다.
    "B008",
    # naive datetime -> tz-aware 전환은 저장값 의미가 바뀌는 마이그레이션 건이다.
    "DTZ003", "DTZ005",
    # 한글 전각 문장부호를 혼동 문자로 잡는 규칙이라 이 코드베이스에 맞지 않는다.
    "RUF001", "RUF002", "RUF003",
    # SQLModel 컬럼·Pydantic 직렬화가 (str, Enum) 값 표현에 의존한다.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# agents 패키지는 재수출(import *)로 임포트 호환을 유지한다.
"app/ai/agents/*.py" = ["F401", "F403", "F405"]
"app/models/wms.py" = ["F401", "F403"]
"app/models/*.py" = ["F403", "F405"]
"app/worker/__init__.py" = ["F401", "F403"]
# app/ai 기존 코드의 잔여 위반. B905(zip strict)는 길이 불일치 시 예외를 던지므로
# 미용이 아니라 동작 변경이라 함께 제외한다.
"app/ai/agents/common.py" = ["SIM108"]
"app/ai/agents/detector.py" = ["B905", "RUF046"]
"app/ai/agents/human.py" = ["E501"]
"app/ai/reporting/*.py" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# 없으면 Settings()가 "필수 인자 누락"으로 잘못 잡힌다(값은 환경변수에서 온다).
plugins = ["pydantic.mypy"]
# python_version을 고정하면 실행 인터프리터와 어긋나 서드파티 스텁이 문법 오류로 잡힌다.
# 스텁이 없는 패키지(ultralytics, langgraph 등)가 많아 ignore_missing_imports를 켠다.
ignore_missing_imports = true

# ── mypy 베이스라인 ──
# 타입 오류가 남은 모듈만 검사에서 제외한다. 나머지는 mypy가 하드 게이트로 지킨다.
# 오류 대부분은 SQLModel 컬럼 표현식 오탐이며(런타임은 정상), col()로 해결되는
# 컬럼 연산은 이미 정리했다. 이 목록은 줄여 나갈 부채다.

# ── mypy 베이스라인 ──
# 아래 모듈은 현재 타입 오류가 남아 있어 검사에서 제외한다. 나머지 모듈에 대해서는
# mypy가 하드 게이트로 동작하므로, 새 코드와 깨끗한 모듈은 계속 깨끗하게 유지된다.
#
# 오류의 대부분은 SQLModel 컬럼 표현식에 대한 오탐이다 — mypy가 `Order.shipped_at`을
# 파이썬 필드 타입(datetime)으로 보고 `.desc()`/`.in_()`/비교 연산을 오류로 잡는다.
# 실제 런타임에서는 InstrumentedAttribute라 정상 동작한다(E2E로 검증됨).
#
# 이 목록은 줄여 나갈 부채다. 여기 있는 파일을 손볼 때 오류를 정리하고 항목을 지울 것.
# 반대로 깨끗한 파일에 쿼리를 추가해 오탐이 나면, 사유를 적고 이 목록에 추가한다.
[[tool.mypy.overrides]]
module = [
    "app.ai.agents.critic",
    "app.ai.agents.detector",
    "app.ai.agents.policy",
    "app.ai.agents.report",
    "app.ai.agents.vision",
    "app.ai.rag.critic_cases",
    "app.ai.rag.policy_search",
    "app.ai.supervisor",
    "app.domains.admin.admin",
    "app.domains.admin.admin_inspection_service",
    "app.domains.admin.dashboard_flow_trend_service",
    "app.domains.admin.inbound_dashboard_service",
    "app.domains.admin.outbound_dashboard_service",
    "app.domains.auth.auth",
    "app.domains.auth.auth_service",
    "app.domains.dev.demo_inventory_service",
    "app.domains.dev.mock_order_generator_service",
    "app.domains.inbound.inbound",
    "app.domains.inbound.location_assignment_service",
    "app.domains.inbound.used_inbound",
    "app.domains.inspections.hitl_service",
    "app.domains.inspections.inspections",
    "app.domains.inspections.return_job_service",
    "app.domains.inventory.inventory",
    "app.domains.inventory.rejected_item_service",
    "app.domains.lpn.lpn_scan_service",
    "app.domains.notifications.notification_service",
    "app.domains.orders.fifo_lpn_service",
    "app.domains.orders.outbound",
    "app.domains.pricing.pricing_context_service",
    "app.domains.restock.restock_proposal_service",
    "app.domains.restock.restock_service",
]
ignore_errors = true
