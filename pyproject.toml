[project]
name = "wms-core-backend"
version = "0.1.0"
description = "B2B AI Book Inspection & WMS Platform"
readme = "guide.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlmodel>=0.0.19",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.3.4",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.3.0",
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "langchain>=0.2.6",
    "langgraph>=0.1.4",
    "langchain-openai>=0.1.10",
    "langgraph-checkpoint>=1.0.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "celery>=5.6.3",
    "redis>=8.0.1",
    "gevent>=26.5.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-community>=0.4.2",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
]
