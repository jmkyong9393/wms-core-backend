apiVersion: batch/v1
kind: CronJob
metadata:
  name: auto-po-batch
  namespace: default
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: auto-po-batch
            image: wms-ai:latest
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "app.ai.demand.auto_po_batch"]
            env:
            # 로컬(Kind) 테스트 환경을 위해 호스트의 포트로 접속하도록 host.docker.internal 사용
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fds-db-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://host.docker.internal:6380/0"
            - name: CHROMA_SERVER_HOST
              value: "host.docker.internal"
            - name: CHROMA_SERVER_PORT
              value: "8002"
            - name: INITIAL_MASTER_EMPLOYEE_ID
              valueFrom:
                secretKeyRef:
                  name: wms-master-secret
                  key: INITIAL_MASTER_EMPLOYEE_ID
            - name: INITIAL_MASTER_NAME
              valueFrom:
                secretKeyRef:
                  name: wms-master-secret
                  key: INITIAL_MASTER_NAME
            - name: INITIAL_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wms-master-secret
                  key: INITIAL_MASTER_PASSWORD
            - name: AUTO_PO_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: wms-master-secret
                  key: AUTO_PO_TENANT_ID
          restartPolicy: OnFailure
