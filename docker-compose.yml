services:
  db:
    image: postgres:15-alpine
    container_name: wms-core-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wms_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d wms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma-server:
    image: chromadb/chroma:1.5.9
    container_name: wms-core-chroma
    restart: always
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wms-core-redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    container_name: wms-core-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
    # 마이그레이션은 이미지에 구워지지만, 로컬에서 새로 추가한 리비전이 즉시
    # 반영되도록 소스를 마운트한다(app 핫리로드와 동일한 이유).
    volumes:
      - ./alembic:/app/alembic:ro
      - ./app:/app/app
    command: ["alembic", "upgrade", "head"]

  # UBCI/WMS 정책 문서를 Chroma에 시딩하는 one-shot 작업.
  # Policy Agent가 조회하는 컬렉션(wms_ubci_policies)의 정식 시딩 절차이며,
  # ingest.py(wms_return_policies)는 legacy로 Policy Agent가 읽지 않는다.
  rag-seed:
    build: .
    container_name: wms-core-rag-seed
    restart: "no"
    depends_on:
      chroma-server:
        condition: service_started
    env_file:
      - .env
    environment:
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
    # Dockerfile은 docs를 이미지에 굽지 않으므로 시딩 원문은 마운트로 공급한다
    volumes:
      - ./docs/ai_knowledge_base:/app/docs/ai_knowledge_base:ro
    command: ["python", "-m", "app.ai.rag.policy_search"]

  api:
    build: .
    container_name: wms-core-api
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
      SSE_TICKET_EXPIRE_SECONDS: 300
    # Hot-reload mapping for local dev (overrides CMD to use reload)
    volumes:
      - ./app:/app/app
      - ./models:/app/models:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build: .
    container_name: wms-core-worker
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    # Hot-reload mapping for local dev
    volumes:
      - ./app:/app/app
      - ./models:/app/models:ro
    
    # AI 검수 비동기 작업을 처리하는 Celery Worker
    command: ["celery", "-A", "app.worker", "worker", "-l", "info", "--pool=gevent", "-E"]

  inspection-worker:
    build: .
    container_name: wms-core-inspection-worker
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - ./models:/app/models:ro
    # 검수 워커만 prefork를 쓴다. YOLO/torch 추론은 C 확장 안에서 CPU를 점유해
    # 그린렛에 양보하지 않으므로, gevent 풀에서는 동시 실행이 서로를 막고
    # soft_time_limit 계측도 왜곡된다. 동시성 2는 컨테이너 메모리 기준값이다.
    command: ["celery", "-A", "app.worker", "worker", "-Q", "inspection", "-l", "info", "--pool=prefork", "-c", "2", "-E", "-n", "inspection@%h"]

  restock-worker:
    build: .
    container_name: wms-core-restock-worker
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
    command: ["celery", "-A", "app.worker", "worker", "-Q", "restock", "-l", "info", "--pool=gevent", "-E", "-n", "restock@%h"]

  mock-order-generator:
    build: .
    container_name: wms-core-mock-order-generator
    profiles:
      - demo
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      MOCK_ORDER_INTERVAL_SECONDS: "1"
    volumes:
      - ./app:/app/app
    command:
      [
        "python",
        "-m",
        "app.batch.mock_order_generator",
      ]

  # flower 컨테이너 추가
  flower:
    image: mher/flower
    container_name: wms-core-flower
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5556:5555"
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]


volumes:
  postgres_data:
  chroma_data:
