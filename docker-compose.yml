services:
  db:
    image: postgres:15-alpine
    container_name: wms-core-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wms_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d wms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma-server:
    image: chromadb/chroma:1.5.9
    container_name: wms-core-chroma
    restart: always
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wms-core-redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    container_name: wms-core-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    container_name: wms-core-api
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
      SSE_TICKET_EXPIRE_SECONDS: 300
    # Hot-reload mapping for local dev (overrides CMD to use reload)
    volumes:
      - ./app:/app/app
      - ./models:/app/models:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build: .
    container_name: wms-core-worker
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    # Hot-reload mapping for local dev
    volumes:
      - ./app:/app/app
      - ./models:/app/models:ro
    
    # AI 검수 비동기 작업을 처리하는 Celery Worker
    command: ["celery", "-A", "app.worker", "worker", "-l", "info", "--pool=gevent", "-E"]

  inspection-worker:
    build: .
    container_name: wms-core-inspection-worker
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
    command: ["celery", "-A", "app.worker", "worker", "-Q", "inspection", "-l", "info", "--pool=gevent", "-E", "-n", "inspection@%h"]

  restock-worker:
    build: .
    container_name: wms-core-restock-worker
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      chroma-server:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      CHROMA_SERVER_HOST: chroma-server
      CHROMA_SERVER_PORT: 8000
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
    command: ["celery", "-A", "app.worker", "worker", "-Q", "restock", "-l", "info", "--pool=gevent", "-E", "-n", "restock@%h"]

  mock-order-generator:
    build: .
    container_name: wms-core-mock-order-generator
    profiles:
      - demo
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/wms_db
      MOCK_ORDER_INTERVAL_SECONDS: "1"
    volumes:
      - ./app:/app/app
    command:
      [
        "python",
        "-m",
        "app.batch.mock_order_generator",
      ]

  # flower 컨테이너 추가
  flower:
    image: mher/flower
    container_name: wms-core-flower
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5556:5555"
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]


volumes:
  postgres_data:
  chroma_data:
